<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BMW M4: STUDIO EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Teko', sans-serif;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-left: 4px solid #00aaff;
            transform: skew(-15deg);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
            transition: all 0.2s;
        }

        .stat-label {
            font-size: 1.4rem;
            color: #ccc;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 3rem;
            color: #fff;
            font-weight: 600;
            line-height: 0.9;
        }

        .hud-bottom {
            position: absolute;
            bottom: 30px;
            right: 40px;
            text-align: right;
        }

        .speed-val {
            font-size: 9rem;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 30px #00aaff;
            line-height: 0.8;
        }

        .speed-unit {
            font-size: 2.5rem;
            color: #00aaff;
            letter-spacing: 4px;
        }

        .nitro-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .nitro-label {
            font-size: 1.5rem;
            color: #00aaff;
            margin-right: 15px;
            transform: skew(-15deg);
        }

        .nitro-container {
            width: 300px;
            height: 12px;
            background: #222;
            transform: skew(-15deg);
            overflow: hidden;
            border: 1px solid #444;
        }

        #nitro-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff9900, #ff0000);
            box-shadow: 0 0 15px #ff5500;
            transition: width 0.1s;
        }

        /* SCREENS */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: default;
            pointer-events: auto;
        }

        #crash-screen {
            display: none;
            background: rgba(50, 0, 0, 0.9);
        }

        #garage-screen {
            display: flex;
            background: #050510;
        }

        .title {
            font-size: 6rem;
            color: #00aaff;
            text-shadow: 0 0 40px #0055ff;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1;
            text-align: center;
        }

        .subtitle {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .wasted {
            font-size: 8rem;
            color: #ff0000;
            text-shadow: 0 0 60px red;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        .btn {
            border: 2px solid #00aaff;
            padding: 15px 50px;
            color: #fff;
            font-size: 2.5rem;
            font-family: 'Teko';
            background: transparent;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #00aaff;
            color: #000;
            box-shadow: 0 0 30px #00aaff;
            transform: scale(1.05);
        }

        .btn-red {
            border-color: #ff0000;
            color: #ff0000;
        }

        .btn-red:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 30px #ff0000;
        }

        /* GARAGE */
        .color-opts {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .swatch {
            width: 80px;
            height: 80px;
            border: 2px solid #555;
            cursor: pointer;
            transition: 0.2s;
            transform: skew(-10deg);
        }

        .swatch:hover,
        .swatch.selected {
            border-color: #fff;
            transform: scale(1.1) skew(-10deg);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .s-blue {
            background: #0033bb;
        }

        .s-red {
            background: #bb0000;
        }

        .s-black {
            background: #111;
        }

        @keyframes pulse {
            0% {
                opacity: 0.8;
                transform: scale(0.98);
            }

            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>
    <div id="ui">
        <div class="hud-top">
            <div class="stat-box">
                <div class="stat-label">DISTANCE</div>
                <div class="stat-value" id="dist">0m</div>
            </div>
            <div class="stat-box" style="border-left:none; border-right:4px solid #00aaff; text-align:right;">
                <div class="stat-label">TIME</div>
                <div class="stat-value" id="time">00:00</div>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="speed-val" id="speed">0</div>
            <div class="speed-unit">KM/H</div>
            <div class="nitro-wrapper">
                <div class="nitro-label">NITRO</div>
                <div class="nitro-container">
                    <div id="nitro-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- GARAGE SCREEN -->
    <div id="garage-screen" class="screen">
        <h1 class="title">GARAGE</h1>
        <div class="subtitle">SELECT PAINT CONFIGURATION</div>
        <div class="color-opts">
            <div class="swatch s-blue selected" data-color="0x0033bb" onclick="selectColor(this)"></div>
            <div class="swatch s-red" data-color="0xbb0000" onclick="selectColor(this)"></div>
            <div class="swatch s-black" data-color="0x111111" onclick="selectColor(this)"></div>
        </div>
        <button class="btn" onclick="goToStart()">CONFIRM SELECTION</button>
    </div>

    <!-- START SCREEN -->
    <div id="overlay" class="screen" style="display:none;">
        <h1 class="title">BMW M4 <br><span style="font-size:3rem; color:#fff;">STUDIO EDITION</span></h1>
        <div class="subtitle" style="margin-top:20px; color:#aaa; font-size:1.3rem;">
            [WASD] DRIVE | [SHIFT] NITRO | [SPACE] BRAKE
        </div>
        <button class="btn" id="start-btn">START RACE</button>
    </div>

    <!-- CRASH SCREEN -->
    <div id="crash-screen">
        <div class="wasted">WASTED</div>
        <button class="btn btn-red" id="restart-btn">RETRY</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';

        // --- GLOBALS ---
        window.selectColor = function (el) {
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            CONFIG.PLAYER.COLOR = parseInt(el.getAttribute('data-color'));
        };
        window.goToStart = function () {
            document.getElementById('garage-screen').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
            // Update car color immediately
            if (mPaint) mPaint.color.setHex(CONFIG.PLAYER.COLOR);
        };

        // --- CONFIG ---
        const CONFIG = {
            PLAYER: {
                MASS: 1500, ENGINE: 11000, NITRO_FORCE: 20000, BRAKE: 300,
                FRICTION: 5.0, STEER: 0.55, COLOR: 0x0033bb
            },
            WORLD: { GRAVITY: -9.82, ROAD_W: 50, CHUNK: 400, TREES: 2000, TRAFFIC_COUNT: 10 }
        };

        const INPUT = { w: 0, s: 0, a: 0, d: 0, shift: 0, space: 0 };
        const STATE = { mode: 'menu', speed: 0, nitro: 100, time: 0, steer: 0 };

        // --- AUDIO ENGINE ---
        const Audio = {
            ctx: null, engineOsc: null, nitroOsc: null,
            init: function () {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();

                // Engine Sound
                this.engineOsc = this.ctx.createOscillator();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.value = 100;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.1;
                this.engineOsc.connect(gain).connect(this.ctx.destination);
                this.engineOsc.start();

                // Nitro Sound (High pitch sine + noise ideally, simplified here)
                this.nitroOsc = this.ctx.createOscillator();
                this.nitroOsc.type = 'square';
                this.nitroOsc.frequency.value = 200;
                this.nitroGain = this.ctx.createGain();
                this.nitroGain.gain.value = 0;
                this.nitroOsc.connect(this.nitroGain).connect(this.ctx.destination);
                this.nitroOsc.start();
            },
            update: function (speed, nitroActive) {
                if (!this.ctx) return;
                // Engine Pitch based on Speed (0-100m/s -> 100-600Hz)
                const pitch = 100 + (speed * 10);
                this.engineOsc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.1);

                // Nitro
                if (nitroActive) this.nitroOsc.frequency.setValueAtTime(400 + Math.random() * 200, this.ctx.currentTime);
                this.nitroGain.gain.setTargetAtTime(nitroActive ? 0.1 : 0, this.ctx.currentTime, 0.1);
            }
        };

        // --- SCENE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloom.strength = 1.0; bloom.radius = 0.5;
        composer.addPass(bloom);

        const afterimage = new AfterimagePass();
        afterimage.damp = 0.8; // High damp = heavy blur
        afterimage.enabled = false;
        composer.addPass(afterimage);

        // --- PHYSICS ---
        const world = new CANNON.World();
        world.gravity.set(0, CONFIG.WORLD.GRAVITY, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);
        const matGround = new CANNON.Material();
        const matCar = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(matGround, new CANNON.Material(), { friction: 5.0 }));
        world.addContactMaterial(new CANNON.ContactMaterial(matCar, matGround, { friction: 0.0 }));

        // --- ASSETS ---
        const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 1024, 1024);
        for (let i = 0; i < 300000; i++) {
            ctx.fillStyle = Math.random() < 0.5 ? '#161616' : '#0c0c0c';
            ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
        }
        const tRoad = new THREE.CanvasTexture(c);
        tRoad.wrapS = tRoad.wrapT = THREE.RepeatWrapping; tRoad.repeat.set(1, 4); tRoad.anisotropy = 16;

        // --- PROCEDURAL HELPERS ---
        const createWheel = (r = 0.3) => {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.25, 16).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x111 }));
            m.add(new THREE.Mesh(new THREE.CylinderGeometry(r * 0.6, r * 0.6, 0.26, 16).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x888 })));
            return m;
        };

        const TRAFFIC_TYPES = [
            (c = 0x228822) => {
                const g = new THREE.Group(); const m = new THREE.MeshStandardMaterial({ color: c });
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 1.2), m).translateX(0).translateY(0.4).translateZ(-1.2));
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 1.5), m).translateY(0.7).translateZ(0.1));
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 0.8), m).translateY(0.4).translateZ(1.2));
                [[0.8, 1], [-0.8, 1], [0.8, -1], [-0.8, -1]].forEach(p => { const w = createWheel(); w.position.set(p[0], 0.3, p[1]); g.add(w) }); return g;
            },
            (c = 0xcccc00) => {
                const g = new THREE.Group(); const m = new THREE.MeshStandardMaterial({ color: c });
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.65, 3), m).translateY(0.5));
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.8), m).translateY(1.1).translateZ(-0.2));
                [[0.85, 1], [-0.85, 1], [0.85, -1], [-0.85, -1]].forEach(p => { const w = createWheel(); w.position.set(p[0], 0.3, p[1]); g.add(w) }); return g;
            },
            (c = 0x0044aa) => {
                const g = new THREE.Group(); const m = new THREE.MeshStandardMaterial({ color: c });
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.8, 4), m).translateY(0.7));
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.5), m).translateY(1.4).translateZ(-0.2));
                [[0.9, 1.4], [-0.9, 1.4], [0.9, -1.4], [-0.9, -1.4]].forEach(p => { const w = createWheel(0.4); w.position.set(p[0], 0.4, p[1]); g.add(w) }); return g;
            }
        ];

        // --- ENV ---
        const roadMat = new THREE.MeshStandardMaterial({ map: tRoad, roughness: 0.8 });
        const roadChunks = [];
        for (let i = 0; i < 6; i++) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.WORLD.ROAD_W, CONFIG.WORLD.CHUNK), roadMat);
            m.rotation.x = -Math.PI / 2; m.receiveShadow = true;
            roadChunks.push(m); scene.add(m);
        }

        // Billboards
        const bbGeo = new THREE.PlaneGeometry(10, 5);
        const bbMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, side: THREE.DoubleSide });
        const bbs = new THREE.InstancedMesh(bbGeo, bbMat, 50);
        scene.add(bbs);
        const bbDummy = new THREE.Object3D();
        const bbData = [];
        for (let i = 0; i < 50; i++) {
            bbDummy.position.set((Math.random() < 0.5 ? 1 : -1) * 40, 5, (Math.random() - 0.5) * 3000);
            bbDummy.rotation.y = Math.PI / 2;
            bbDummy.updateMatrix(); bbs.setMatrixAt(i, bbDummy.matrix);
            bbs.setColorAt(i, new THREE.Color().setHSL(Math.random(), 1, 0.5));
            bbData.push({ x: bbDummy.position.x, z: bbDummy.position.z });
        }

        // Trees
        const tGeo = new THREE.ConeGeometry(2, 14, 5); tGeo.translate(0, 7, 0);
        const tMat = new THREE.MeshStandardMaterial({ color: 0x052205 });
        const treeInst = new THREE.InstancedMesh(tGeo, tMat, CONFIG.WORLD.TREES);
        treeInst.castShadow = true; scene.add(treeInst);
        const treesData = [];
        const dummy = new THREE.Object3D();
        for (let i = 0; i < CONFIG.WORLD.TREES; i++) {
            const x = (Math.random() < 0.5 ? 1 : -1) * (30 + Math.random() * 80);
            const z = (Math.random() - 0.5) * 3000;
            const s = 0.5 + Math.random() * 1.5;
            dummy.position.set(x, 0, z); dummy.scale.set(s, s, s); dummy.rotation.y = Math.random() * 6;
            dummy.updateMatrix(); treeInst.setMatrixAt(i, dummy.matrix);
            treesData.push({ x, z, s, r: dummy.rotation.y });
        }

        const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(50, 150, 50); sun.castShadow = true; scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404050));

        // --- PLAYER CAR ---
        const carGrp = new THREE.Group();
        const chassisMesh = new THREE.Group();
        carGrp.add(chassisMesh); scene.add(carGrp);
        const mPaint = new THREE.MeshStandardMaterial({ color: CONFIG.PLAYER.COLOR, metalness: 0.7, roughness: 0.2 });

        // Body (Simplified M4)
        chassisMesh.add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 4.6), mPaint).translateY(0.5));
        chassisMesh.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.45, 2.4), mPaint).translateX(0).translateY(1).translateZ(-0.2));

        // Flames
        const flameGeo = new THREE.ConeGeometry(0.1, 0.8, 8).rotateX(Math.PI / 2);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });
        const flameL = new THREE.Mesh(flameGeo, flameMat); flameL.position.set(-0.5, 0.3, 2.5); flameL.visible = false;
        const flameR = new THREE.Mesh(flameGeo, flameMat); flameR.position.set(0.5, 0.3, 2.5); flameR.visible = false;
        chassisMesh.add(flameL, flameR);

        // Lights
        const hl = new THREE.SpotLight(0xffffff, 200, 300, 0.6, 0.5); hl.position.set(0, 0.8, -2); hl.target.position.set(0, 0, -20);
        chassisMesh.add(hl); chassisMesh.add(hl.target);
        const ug = new THREE.PointLight(0x0088ff, 6, 12); ug.position.set(0, 0.3, 0); chassisMesh.add(ug);

        // Physics
        const cBody = new CANNON.Body({ mass: 1500, material: matCar });
        cBody.addShape(new CANNON.Box(new CANNON.Vec3(0.95, 0.4, 2.3)), new CANNON.Vec3(0, 0.6, 0));
        cBody.position.set(0, 2, 0); cBody.linearDamping = 0.5; cBody.angularDamping = 0.5;

        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: cBody,
            indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
        });
        const wo = {
            radius: 0.35, directionLocal: new CANNON.Vec3(0, -1, 0), suspensionStiffness: 45, suspensionRestLength: 0.4,
            frictionSlip: 5.0, dampingRelaxation: 2.3, dampingCompression: 4.5, maxSuspensionForce: 100000,
            rollInfluence: 0.05, axleLocal: new CANNON.Vec3(-1, 0, 0), chassisConnectionPointLocal: new CANNON.Vec3(0, 0, 0),
            maxSuspensionTravel: 0.2, useCustomSlidingRotationalSpeed: true, customSlidingRotationalSpeed: -30
        };
        wo.chassisConnectionPointLocal.set(0.85, 0.2, 1.4); vehicle.addWheel(wo);
        wo.chassisConnectionPointLocal.set(-0.85, 0.2, 1.4); vehicle.addWheel(wo);
        wo.chassisConnectionPointLocal.set(0.85, 0.2, -1.4); vehicle.addWheel(wo);
        wo.chassisConnectionPointLocal.set(-0.85, 0.2, -1.4); vehicle.addWheel(wo);
        vehicle.addToWorld(world);

        const wheelMeshes = [];
        const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 32).rotateZ(Math.PI / 2);
        for (let i = 0; i < 4; i++) {
            const m = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({ color: 0x111 }));
            wheelMeshes.push(m); scene.add(m);
        }
        world.addBody(new CANNON.Body({ mass: 0, material: matGround, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI / 2, 0, 0) }));

        // --- TRAFFIC ---
        const traffic = [];
        function spawnTraffic() {
            traffic.forEach(t => scene.remove(t.mesh)); traffic.length = 0;
            for (let i = 0; i < CONFIG.WORLD.TRAFFIC_COUNT; i++) {
                const r = Math.random();
                let mesh = (r < 0.33 ? TRAFFIC_TYPES[0]() : (r < 0.66 ? TRAFFIC_TYPES[1]() : TRAFFIC_TYPES[2]()));
                mesh.castShadow = true;
                // Add lights
                const rl = new THREE.PointLight(0xff0000, 2, 5); rl.position.set(0, 1, 2); mesh.add(rl);
                const fl = new THREE.SpotLight(0xffffff, 50, 50, 0.5, 0.5); fl.position.set(0, 1, -2); fl.target.position.set(0, 0, -10); mesh.add(fl); mesh.add(fl.target);

                scene.add(mesh);
                traffic.push({ mesh, z: -200 - Math.random() * 400, lane: (Math.random() < 0.5 ? 6 : -6), speed: 15 + Math.random() * 15 });
            }
        }
        spawnTraffic();

        // --- LOOP ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            STATE.mode = 'playing'; Audio.init();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            cBody.position.set(0, 2, 0); cBody.quaternion.set(0, 0, 0, 1); cBody.velocity.set(0, 0, 0); cBody.angularVelocity.set(0, 0, 0);
            STATE.nitro = 100; STATE.mode = 'playing'; document.getElementById('crash-screen').style.display = 'none';
            spawnTraffic();
        });

        const onKey = (e, v) => {
            const k = e.code;
            if (k === 'KeyW' || k === 'ArrowUp') INPUT.w = v;
            if (k === 'KeyS' || k === 'ArrowDown') INPUT.s = v;
            if (k === 'KeyA' || k === 'ArrowLeft') INPUT.a = v;
            if (k === 'KeyD' || k === 'ArrowRight') INPUT.d = v;
            if (k === 'ShiftLeft') INPUT.shift = v;
            if (k === 'Space') INPUT.space = v;
        };
        window.addEventListener('keydown', e => onKey(e, 1)); window.addEventListener('keyup', e => onKey(e, 0));

        const clock = new THREE.Clock();
        const pBox = new THREE.Box3(); const tBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);
            if (STATE.mode === 'menu') {
                const t = Date.now() * 0.0003; camera.position.set(Math.sin(t) * 20, 8, Math.cos(t) * 20); camera.lookAt(0, 0, 0); composer.render(); return;
            }
            if (STATE.mode === 'crashed') { composer.render(); return; }

            const dt = Math.min(clock.getDelta(), 0.1);
            STATE.time += dt;

            // Physics
            let eng = INPUT.w ? CONFIG.PLAYER.ENGINE : (INPUT.s ? -CONFIG.PLAYER.ENGINE : 0);
            if (INPUT.shift && STATE.nitro > 0) { eng = CONFIG.PLAYER.NITRO_FORCE; STATE.nitro -= CONFIG.PLAYER.NITRO_DRAIN; }
            else if (STATE.nitro < 100) STATE.nitro += CONFIG.PLAYER.NITRO_REGEN;

            vehicle.applyEngineForce(eng, 2); vehicle.applyEngineForce(eng, 3);
            let brake = INPUT.space ? CONFIG.PLAYER.BRAKE * 8 : 0;
            vehicle.setBrake(brake, 0); vehicle.setBrake(brake, 1); vehicle.setBrake(brake, 2); vehicle.setBrake(brake, 3);

            let tgt = (INPUT.a ? CONFIG.PLAYER.STEER : (INPUT.d ? -CONFIG.PLAYER.STEER : 0));
            STATE.steer += (tgt - STATE.steer) * 0.1;
            vehicle.setSteeringValue(STATE.steer, 0); vehicle.setSteeringValue(STATE.steer, 1);

            world.step(1 / 60, dt, 3);

            // Sync
            carGrp.position.copy(cBody.position); carGrp.quaternion.copy(cBody.quaternion);
            for (let i = 0; i < 4; i++) { vehicle.updateWheelTransform(i); wheelMeshes[i].position.copy(vehicle.wheelInfos[i].worldTransform.position); wheelMeshes[i].quaternion.copy(vehicle.wheelInfos[i].worldTransform.quaternion); }

            // AAA FX
            const speed = cBody.velocity.length();
            Audio.update(speed, INPUT.shift && STATE.nitro > 0);

            // Flames
            const flameOn = INPUT.shift && STATE.nitro > 0;
            flameL.visible = flameR.visible = flameOn;
            if (flameOn) {
                const s = 1 + Math.random();
                flameL.scale.set(s, s, s); flameR.scale.set(s, s, s);
            }
            // Motion Blur
            afterimage.enabled = speed > 50; // > 180kmh (50m/s)

            // Cam Tilt
            camera.rotation.z = -STATE.steer * 0.15;

            // Env Sync
            const z = cBody.position.z;
            const cz = Math.floor(z / CONFIG.WORLD.CHUNK);
            roadChunks.forEach((c, i) => c.position.z = (cz - i) * CONFIG.WORLD.CHUNK + CONFIG.WORLD.CHUNK / 2);
            bbs.position.z = z; // Simplified movement or just standard instance loop
            // (For simplify, reusing tree loop logic for bbs would be better, but we let them stay static for now or cycle)

            treesData.forEach((d, i) => {
                if (d.z > z + 200) d.z -= 3000; if (d.z < z - 2800) d.z += 3000;
                dummy.position.set(d.x, 0, d.z); dummy.scale.set(d.s, d.s, d.s); dummy.rotation.y = d.r;
                dummy.updateMatrix(); treeInst.setMatrixAt(i, dummy.matrix);
            });
            treeInst.instanceMatrix.needsUpdate = true;

            // Traffic
            pBox.setFromObject(chassisMesh);
            traffic.forEach(t => {
                t.mesh.position.set(t.lane, 0, t.z);
                t.z += t.speed * dt;
                if (t.z > z + 50) { t.z = z - 400 - Math.random() * 400; t.lane = Math.random() < 0.5 ? 6 : -6; }
                tBox.setFromObject(t.mesh);
                if (pBox.intersectsBox(tBox)) { STATE.mode = 'crashed'; document.getElementById('crash-screen').style.display = 'flex'; }
            });

            // Camera Follow
            const cTgt = new THREE.Vector3(0, 5, 12).applyQuaternion(cBody.quaternion).add(cBody.position);
            cTgt.y = Math.max(cTgt.y, 1);
            camera.position.lerp(cTgt, 0.1);
            camera.lookAt(cBody.position.x, cBody.position.y + 1, cBody.position.z);
            camera.fov = 75 + (speed * 0.5); camera.updateProjectionMatrix();

            // UI
            document.getElementById('speed').innerText = Math.floor(speed * 3.6);
            document.getElementById('dist').innerText = Math.floor(Math.abs(z)) + "m";
            document.getElementById('time').innerText = new Date(STATE.time * 1000).toISOString().substr(14, 5);
            document.getElementById('nitro-bar').style.width = STATE.nitro + "%";

            composer.render();
        }
        animate();
    </script>
</body>

</html>
